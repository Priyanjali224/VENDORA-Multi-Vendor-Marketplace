services:
  - type: web
    name: vendora-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DEFAULT_COMMISSION_PERCENTAGE
        value: 10
      - key: STORAGE_DRIVER
        value: local
      - key: PAYMENT_GATEWAY
        value: razorpay
      - key: RAZORPAY_KEY_ID
        value: rzp_test_vendoraDemoKey123
      - key: RAZORPAY_KEY_SECRET
        value: rzp_test_vendoraSecretKey456
