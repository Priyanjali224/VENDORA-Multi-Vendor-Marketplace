services:
  - type: web
    name: vendora
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: STORAGE_DRIVER
        value: gridfs
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DEFAULT_COMMISSION_PERCENTAGE
        value: 10
      - key: PAYMENT_GATEWAY
        value: razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
